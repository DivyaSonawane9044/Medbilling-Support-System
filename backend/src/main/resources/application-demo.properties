# Demo profile: a self-contained showcase database filled with realistic sample data.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
#   java -jar target/<app>.jar --spring.profiles.active=demo
# Uses its own H2 file (backend/data/medbilling-demo.mv.db), so demo rows never land in the
# default "medbilling" database. Sample data is inserted only while that file is empty;
# delete data/medbilling-demo.* to regenerate it with dates relative to today.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medbilling-demo;AUTO_SERVER=TRUE}
app.demo-data.enabled=true
