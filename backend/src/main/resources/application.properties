spring.application.name=medbilling-backend
server.port=${SERVER_PORT:8081}

# === DATABASE (default profile: persistent H2 file for local development) ===
# Data is stored in backend/data/medbilling.mv.db and survives restarts.
# For MySQL use: --spring.profiles.active=mysql (see application-mysql.properties).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medbilling;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Controllers build responses from lazy associations; keep the session open for the request.
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# Demo data (~50 real Indian medicines, 30 patients, 12 distributors, a year of purchases,
# bills and payments) is inserted only when the database is empty AND this flag is true.
# Keep false for real shop data; for demos prefer --spring.profiles.active=demo
# (application-demo.properties), which uses its own H2 file.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# === SECURITY (Clerk) ===
# Clerk session tokens are verified against the instance JWKS. Defaults match the
# development Clerk instance whose publishable key is in frontend/.env.example.
app.security.clerk.issuer=${CLERK_ISSUER:https://refined-albacore-84.clerk.accounts.dev}
app.security.clerk.jwks-uri=${CLERK_JWKS_URI:https://refined-albacore-84.clerk.accounts.dev/.well-known/jwks.json}
# Comma-separated browser origins allowed to call the API (also checked against the token azp claim).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# === RAZORPAY ===
# Leave empty to disable online payments (the UI then only offers cash/UPI/card recording).
# Use rzp_test_* keys for testing. Never commit real keys.
razorpay.api.key=${RAZORPAY_KEY_ID:}
razorpay.api.secret=${RAZORPAY_KEY_SECRET:}
