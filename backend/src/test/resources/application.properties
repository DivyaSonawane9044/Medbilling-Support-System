# Isolated test database: in-memory, recreated per test context, never touches dev/real data
spring.datasource.url=jdbc:h2:mem:medbilling-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
app.demo-data.enabled=false
app.security.clerk.issuer=https://test-issuer.example
app.security.clerk.jwks-uri=https://test-issuer.example/.well-known/jwks.json
app.cors.allowed-origins=http://localhost:5173
razorpay.api.key=
razorpay.api.secret=
