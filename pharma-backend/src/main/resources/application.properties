server.port=8081
server.address=0.0.0.0

# === DATABASE CONFIGURATION ===
# H2 in-memory DB for development and quick runs
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Razorpay Integration Config (replace with keys from https://dashboard.razorpay.com)
# Leave placeholders for demo/mock checkout in Payments page
razorpay.api.key=YOUR_RAZORPAY_KEY_ID
razorpay.api.secret=YOUR_RAZORPAY_KEY_SECRET