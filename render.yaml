# Render Blueprint: backend API as a Docker web service.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: medbilling-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true # redeploy on every push to main (CD)
    branch: main
    healthCheckPath: /api/health
    envVars:
      # "demo" = self-contained H2 database filled with realistic sample data on every start.
      # Free instances have no persistent disk, so the demo data is regenerated (with today's dates) after each restart.
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Browser origins allowed to call the API: the Vercel site URL(s), comma separated
      - key: CORS_ALLOWED_ORIGINS
        value: https://medbilling-support-system.vercel.app
